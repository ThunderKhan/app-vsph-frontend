<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Something new is on the way. VSPH Control Center is launching soon." />
  <title>Coming Soon | VSPH Control Center</title>
  <!--
    Adapted from "Coming Soon 2" by Mohammad Shehadeh / Hirael.
    Source: https://hirael.com/blocks/not-found/coming-soon-02
    License: MIT. Reimplemented in dependency-free HTML/CSS for Cloudflare Workers Static Assets.
    Visual tokens and typography adapted to the VSPH Design System (September 2026).
  -->
  <style>
    :root {
      color-scheme: light;
      --brand-navy: #00255A;
      --brand-core-blue: #0069C8;
      --brand-light-blue: #50C0E8;
      --neutral-white: #FFFFFF;
      --neutral-grey: #F1F2F2;
      --muted: #526378;
      --border: #DDE6F0;
      --sparkle: #0069C8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { min-height: 100%; }
    body {
      min-height: 100%;
      margin: 0;
      background: var(--neutral-white);
      color: var(--brand-navy);
      font-family: Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .coming-soon {
      position: relative;
      isolation: isolate;
      display: flex;
      min-height: 100svh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding-top: 96px;
    }
    .body {
      position: relative;
      z-index: 2;
      display: flex;
      width: 100%;
      max-width: 800px;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-inline: 24px;
      text-align: center;
      animation: body-enter .8s ease-out both;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 32px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(241, 242, 242, .72);
      padding: 6px 16px;
      color: var(--muted);
      font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .14em;
      line-height: 1.4;
      text-transform: uppercase;
      animation: badge-enter .6s ease-out .3s both;
    }
    h1 {
      max-width: 750px;
      margin: 0;
      font-size: clamp(36px, 5.6vw, 72px);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -.045em;
      text-wrap: balance;
    }
    h1 span {
      display: inline-block;
      animation: word-enter .5s ease-out both;
      animation-delay: calc(.2s + var(--i) * .08s);
    }
    h1 .muted { color: var(--muted); }
    h1 .strong { color: var(--brand-navy); }
    .description {
      max-width: 600px;
      margin: 8px 0 0;
      color: var(--muted);
      font-size: clamp(16px, 1.75vw, 18px);
      font-weight: 400;
      line-height: 1.65;
      text-wrap: pretty;
      animation: fade-in .6s ease-out .8s both;
    }
    .actions { margin-top: 16px; animation: action-enter .6s ease-out 1s both; }
    .status {
      min-height: 36px;
      padding: 8px 20px;
      background: rgba(255,255,255,.86);
      color: var(--brand-navy);
      font-family: Inter, Arial, sans-serif;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      animation: none;
    }
    .horizon {
      position: relative;
      width: 100%;
      height: 384px;
      flex-shrink: 0;
      margin-top: -128px;
      overflow: hidden;
      -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, #000 0%, transparent 100%);
      mask-image: radial-gradient(50% 50% at 50% 50%, #000 0%, transparent 100%);
      pointer-events: none;
    }
    .horizon::after {
      position: absolute;
      z-index: 1;
      top: 50%;
      left: -50%;
      width: 200%;
      aspect-ratio: 1 / .7;
      border-top: 1px solid var(--border);
      border-radius: 100%;
      background: var(--neutral-grey);
      content: "";
    }
    .horizon-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 100%, rgba(0,105,200,.2), transparent 70%);
      opacity: .4;
    }
    .sparkles {
      position: absolute;
      inset: 0;
      -webkit-mask-image: radial-gradient(50% 50% at 50% 50%, #000 0%, transparent 85%);
      mask-image: radial-gradient(50% 50% at 50% 50%, #000 0%, transparent 85%);
    }
    .sparkle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 2px);
      height: var(--size, 2px);
      border-radius: 50%;
      background: var(--sparkle);
      opacity: .4;
      animation: twinkle var(--duration, 5s) ease-in-out var(--delay, 0s) infinite;
    }
    .sparkle::after {
      position: absolute;
      inset: -3px;
      border: 1px solid rgba(80,192,232,.2);
      border-radius: 50%;
      content: "";
    }
    .page-label {
      position: absolute;
      z-index: 2;
      bottom: 24px;
      padding-inline: 20px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .025em;
      text-align: center;
    }
    @keyframes body-enter { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes badge-enter { from { opacity: 0; transform: scale(.9); } to { opacity: 1; transform: scale(1); } }
    @keyframes word-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    @keyframes action-enter { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes twinkle { 0%, 100% { opacity: .12; transform: scale(.85); } 50% { opacity: .58; transform: scale(1); } }
    @media (max-width: 640px) {
      .coming-soon { padding-top: 32px; }
      .body { gap: 16px; padding-inline: 20px; }
      h1 { font-size: clamp(36px, 10vw, 50px); line-height: 1.18; letter-spacing: -.035em; }
      .description { margin-top: 4px; line-height: 1.5; }
      .actions { margin-top: 12px; }
      .horizon { height: 290px; margin-top: -68px; }
      .page-label { bottom: 16px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .body, .badge, h1 span, .description, .actions, .sparkle { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="coming-soon" data-slot="coming-soon">
    <div class="body" data-slot="coming-soon-body">
      <span class="badge" data-slot="coming-soon-badge">Launching soon</span>
      <h1 data-slot="coming-soon-title" aria-label="Something new is on the way">
        <span class="muted" style="--i:0">Something&nbsp;</span><span class="muted" style="--i:1">new&nbsp;</span><span class="muted" style="--i:2">is&nbsp;</span><span class="strong" style="--i:3">on&nbsp;</span><span class="strong" style="--i:4">the&nbsp;</span><span class="strong" style="--i:5">way</span>
      </h1>
      <p class="description" data-slot="coming-soon-description">
        We're preparing the next experience for VSPH Control Center. We're finishing the final details and will share more soon.
      </p>
      <div class="actions" data-slot="coming-soon-actions">
        <span class="badge status" data-slot="coming-soon-cta">Coming soon</span>
      </div>
    </div>
    <div class="horizon" data-slot="coming-soon-horizon" aria-hidden="true">
      <div class="horizon-glow" data-slot="coming-soon-horizon-glow"></div>
      <div class="sparkles" data-slot="coming-soon-sparkles">
        <i class="sparkle" style="--x:23%;--y:28%;--delay:-1s;--size:2px"></i>
        <i class="sparkle" style="--x:29%;--y:39%;--delay:-3s;--size:3px"></i>
        <i class="sparkle" style="--x:36%;--y:20%;--delay:-2s"></i>
        <i class="sparkle" style="--x:42%;--y:41%;--delay:-4s;--duration:6s"></i>
        <i class="sparkle" style="--x:47%;--y:15%;--delay:-.5s;--size:3px"></i>
        <i class="sparkle" style="--x:52%;--y:34%;--delay:-3.5s"></i>
        <i class="sparkle" style="--x:58%;--y:22%;--delay:-2.2s;--size:3px"></i>
        <i class="sparkle" style="--x:65%;--y:37%;--delay:-1.4s"></i>
        <i class="sparkle" style="--x:72%;--y:27%;--delay:-4.7s"></i>
        <i class="sparkle" style="--x:32%;--y:54%;--delay:-2.4s;--size:2px"></i>
        <i class="sparkle" style="--x:39%;--y:63%;--delay:-3.8s"></i>
        <i class="sparkle" style="--x:50%;--y:55%;--delay:-1.7s;--size:3px"></i>
        <i class="sparkle" style="--x:61%;--y:61%;--delay:-3.1s"></i>
        <i class="sparkle" style="--x:69%;--y:53%;--delay:-2.8s"></i>
      </div>
    </div>
    <div class="page-label">VSPH Control Center</div>
  </main>
</body>
</html>
