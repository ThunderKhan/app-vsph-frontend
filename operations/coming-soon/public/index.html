<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111c19" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Coming Soon | VSPH Control Center</title>
  <meta name="description" content="VSPH Control Center is preparing a new experience. We're coming soon." />
  <style>
    :root {
      color-scheme: light;
      --ink: #17241e;
      --muted: #66756d;
      --paper: #fafaf7;
      --accent: #315c4d;
      --line: #e1e7df;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .shell { width: min(1100px, calc(100% - 48px)); margin-inline: auto; }
    header { padding-top: 34px; }
    .brand { display: inline-flex; align-items: center; gap: 13px; text-decoration: none; color: inherit; }
    .mark {
      display: grid;
      place-items: center;
      width: 39px;
      height: 39px;
      border-radius: 11px;
      background: var(--ink);
      color: white;
    }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: .04em; }
    .brand-detail { color: var(--muted); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-left: 8px; }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      padding-block: 80px 110px;
    }
    .hero { text-align: center; max-width: 750px; }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid #d4e3d8;
      color: #385c46;
      background: #f0f6ef;
      padding: 10px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .dot { height: 7px; width: 7px; background: #5b9169; border-radius: 50%; }
    h1 {
      margin: 31px 0 22px;
      font-size: clamp(46px, 6.5vw, 84px);
      line-height: 1.04;
      font-weight: 590;
      letter-spacing: -.063em;
      text-wrap: balance;
    }
    h1 span { color: var(--accent); }
    .lede {
      margin: 0 auto;
      max-width: 555px;
      color: var(--muted);
      font-size: clamp(16px, 1.7vw, 18px);
      line-height: 1.8;
      text-wrap: pretty;
    }
    .graphic { position: relative; margin: 58px auto 0; width: min(100%, 410px); height: 110px; }
    .graphic::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 3%;
      width: 94%;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9d5cb, transparent);
    }
    .graphic .pill {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 70px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 20px 50px rgba(32, 64, 48, .07);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }
    .graphic .pill .square { width: 23px; height: 23px; border-radius: 6px; border: 6px solid #365d4b; transform: rotate(-16deg); }
    .graphic .pill .bar { width: 55px; height: 5px; border-radius: 5px; background: #d6dfd7; box-shadow: 0 11px #e7ece7, 0 -11px #e7ece7; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 30px; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 20px; color: var(--muted); font-size: 12px; }
    .foot .descriptor { letter-spacing: .04em; }
    @media (max-width: 560px) {
      .shell { width: min(100% - 32px, 1100px); }
      header { padding-top: 21px; }
      .brand-detail { display: none; }
      main { padding-block: 64px 72px; }
      h1 { margin-top: 25px; font-size: clamp(43px, 12vw, 66px); }
      .graphic { margin-top: 30px; }
      .foot { flex-direction: column; align-items: flex-start; gap: 7px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .pill { animation: float 6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
    }
  </style>
</head>
<body>
  <header class="shell">
    <div class="brand" aria-label="VSPH Control Center">
      <span class="mark" aria-hidden="true">
        <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
          <path d="m12 2 9 5-9 5-9-5 9-5Z" />
          <path d="m3 12 9 5 9-5M3 17l9 5 9-5" />
        </svg>
      </span>
      <span class="brand-name">VSPH</span>
      <span class="brand-detail">Control Center</span>
    </div>
  </header>
  <main class="shell">
    <section class="hero" aria-labelledby="main-title">
      <div class="eyebrow"><span class="dot" aria-hidden="true"></span> Work in progress</div>
      <h1 id="main-title">Something better<br /><span>is coming.</span></h1>
      <p class="lede">We're preparing the next experience for VSPH Control Center. Our platform will be available soon.</p>
      <div class="graphic" aria-hidden="true">
        <div class="pill"><span class="square"></span><span class="bar"></span></div>
      </div>
    </section>
  </main>
  <footer>
    <div class="shell foot">
      <span>© 2026 VSPH. All rights reserved.</span>
      <span class="descriptor">Building a better workspace.</span>
    </div>
  </footer>
</body>
</html>
