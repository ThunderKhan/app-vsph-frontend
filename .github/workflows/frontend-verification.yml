name: Frontend verification
on:
  push:
    branches:
      - migration/operations-ui-port
      - integration/projects-live-details
      - integration/ops-live-on-projects-20261119
      - migration/remaining-frontend-parity
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run source, TypeScript, lint and production build checks
        run: npm run check
      - name: Verify unauthenticated routes fail closed
        shell: bash
        run: |
          set -euo pipefail
          npm run start -- -p 3000 > /tmp/vsph-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/vsph-next.log; exit 1; fi
          preview_status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/__preview/workspace)
          if [ "$preview_status" != '404' ]; then
            echo "Production preview must return 404; got $preview_status"
            exit 1
          fi
          # Every authenticated workspace route must redirect before streaming content.
          for protected_path in /dashboard /applications /projects /search /my-work /admin \
            /calendar /organizations /employment /employees /apps/music/launch \
            /reports /notifications /account/profile /account/security /hr \
            /admin/customers /admin/customers/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa \
            /admin/customers/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/lifecycle /admin/finance /admin/finance/manage \
            /admin/finance/journal /admin/onboarding /admin/outreach-access \
            /admin/permissions /admin/products /admin/products/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa \
            /admin/products/new /admin/project-managers /admin/provisioning \
            /employees/new /employees/archived /employees/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/account-link \
            /hr/access /projects/new /projects/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa /projects/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/engineering \
            /projects/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/lifecycle /projects/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/workspace \
            /apps/crm/home; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:3000$protected_path")
            case "$status" in
              302|303|307|308) echo "Anonymous $protected_path redirects: $status" ;;
              *) echo "Anonymous $protected_path must redirect; got $status"; exit 1 ;;
            esac
          done

      - name: Verify credential and application login through isolated backend
        run: node scripts/auth-login-http-smoke.mjs

      - name: Verify project write gateway against isolated mock backend
        run: node scripts/projects-write-http-smoke.mjs

      - name: Verify high-impact migration gateways over production HTTP
        run: node scripts/guarded-operations-http-smoke.mjs

      - name: Verify authenticated owner and employee SSR isolation
        run: node scripts/authenticated-roles-http-smoke.mjs

  browser-preview:
    needs: check
    # Playwright 1.56 Chromium does not support the newer ubuntu-26.04 runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install app and ephemeral browser tester
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Exercise preview roles and responsive layouts in Chromium
        run: node scripts/preview-visual-smoke.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsph-frontend-preview-screenshots
          path: artifacts/ui/
          if-no-files-found: warn
          retention-days: 7
